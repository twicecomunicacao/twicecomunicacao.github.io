sobre:
  rotulo: 01 — A Twice
  titulo: Comunicação em dobro.
  paragrafos:
    - texto: 'A Twice trabalha com produção de vídeos, **de forma mobile**, para diferentes objetivos: desde a cobertura espontânea de um evento até conteúdos planejados, do roteiro à edição.'
    - texto: Cada projeto ganha uma linguagem própria, pensada para a marca, para o público e para sua finalidade, seja para comunicar, divulgar ou simplesmente guardar um momento.
  foto1: assets/img/img_6819.webp
  foto1_nome: Luísa Clara
  foto1_legenda: Videomaker
  foto2: assets/img/img_9095.webp
  foto2_nome: Twice
  foto2_legenda: Comunicação em dobro
  luisa_titulo: Quem está por trás
  luisa_texto: |-
    Prazer, eu sou a Luísa!

    Apaixonada por comunicacao e pelas diferentes formas de contar histórias, encontrei no universo audiovisual uma maneira de unir criatividade e meu interesse pela comunicação.

    Formada em Comunicação pela Universidade Federal do Paraná (UFPR) e pós-graduada em Comunicação Digital pela PUC. Hoje, através da produção de vídeos, uno conhecimento e criatividade para dar vida a projetos que carregam histórias, propósitos e pessoas.
  frase_destaque: Um olhar criativo para o que acontece *fora da tela* fazer sentido *dentro dela*.
servicos:
  rotulo: 02 — Serviços
  titulo: |-
    Do espontâneo
    ao planejado.
  nota: Quatro jeitos de criar com a Twice.
  assinatura: — Luísa Clara
  itens:
    - nome: Cobertura de eventos
      para_quem: Para quem quer guardar o momento
      descricao: Registro do evento, bastidores, detalhes e tudo aquilo que faz parte da experiência. A ideia é criar um material completo e bem pensado, que preserve a essência daquele momento e permita guardar essa experiência para sempre.
      capa: assets/poster/v10.webp
      previa: assets/video/v10-p.mp4
    - nome: Videomaker
      para_quem: Para quem já tem a ideia
      descricao: Você já tem a ideia e sabe o que precisa ser feito? Eu cuido da captação e da edição, seguindo a proposta que você definiu para o vídeo, e te entrego o material pronto.
      capa: assets/poster/v04.webp
      previa: assets/video/v04-p.mp4
    - nome: Storymaker - cobertura real time
      para_quem: Para quem quer o público junto, enquanto acontece
      descricao: Produção de conteúdo em tempo real, pensando no que merece aparecer nos stories enquanto tudo acontece. Registros espontâneos, dinâmicos e naturais, com uma sequência que mantém o público conectado ao evento e à experiência de quem está ali.
      capa: assets/poster/v16.webp
      previa: assets/video/v16-p.mp4
    - nome: Produção do zero
      para_quem: Para quem ainda não sabe por onde começar
      descricao: Você sabe que precisa comunicar algo, mas não sabe como transformar isso em vídeo? Eu desenvolvo a ideia, o roteiro e a direção e cuido de toda a produção, da captação à edição. Quando a proposta pede, também participo do vídeo como modelo.
      capa: assets/poster/v06.webp
      previa: assets/video/v06-p.mp4
