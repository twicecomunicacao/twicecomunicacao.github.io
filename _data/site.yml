perguntas:
  rotulo: "06"
  titulo: "Perguntas frequentes"
  itens:
    - pergunta: "Qual a diferença entre Videomaker e Produção do zero?"
      resposta: "No **Videomaker**, você já chega com a ideia e sabe o que precisa ser feito: eu cuido da captação e da edição, seguindo a proposta que você definiu. Na **Produção do zero**, você sabe que precisa comunicar algo, mas não sabe como transformar isso em vídeo: eu desenvolvo a ideia, o roteiro e a direção e cuido de toda a produção. Quando a proposta pede, também participo do vídeo como modelo."
    - pergunta: "Qual a diferença entre Cobertura de eventos e Storymaker?"
      resposta: "A **Cobertura de eventos** é o registro completo do evento, com bastidores e detalhes, num material pensado para preservar aquele momento. O **Storymaker** é conteúdo em tempo real para os stories, enquanto tudo acontece, mantendo o público conectado. [CONFIRMAR: dá para contratar os dois juntos?]"
