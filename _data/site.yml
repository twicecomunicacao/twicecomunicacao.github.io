perguntas:
  rotulo: '06'
  titulo: Perguntas frequentes
  itens:
    - pergunta: Qual a diferença entre Videomaker e Produção do zero?
      resposta: 'No **Videomaker**, você já tem a ideia e sabe o que precisa ser feito: eu cuido da captação e da edição, seguindo a proposta que você definiu. Na **Produção do zero**, você sabe que precisa comunicar algo, mas não sabe como transformar isso em vídeo: eu desenvolvo a ideia, o roteiro e a direção e cuido de toda a produção. Quando a proposta pede, também participo do vídeo como modelo.'
    - pergunta: Qual a diferença entre Cobertura de eventos e Storymaker?
      resposta: A **Cobertura de evento** é o registro completo do evento, com bastidores e detalhes, em um material pensado para preservar aquele momento. O **Storymaker** é o registro espontâneo em tempo real para os stories, enquanto tudo acontece, mantendo o público conectado ao evento e a experiência de quem está ali. Os dois serviços também podem ser contratados em conjunto!
    - pergunta: Vocês atendem fora de Curitiba?
      resposta: Sim! Estamos em Curitiba, mas também atendemos outras localidades. Entre em contato para conversarmos sobre o seu projeto.
    - pergunta: Qual o prazo de entrega?
      resposta: O prazo de entrega varia conforme o formato e as necessidades de cada projeto. Tudo é alinhado previamente para que você saiba o que esperar e possamos organizar cada etapa com tranquilidade.
    - pergunta: Com quanto tempo de antecedência preciso reservar?
      resposta: '[INSERIR]'
    - pergunta: Como funciona o orçamento?
      resposta: Cada projeto tem suas particularidades, por isso o orçamento é personalizado de acordo com o serviço escolhido, as necessidades e os detalhes da produção. Entre em contato para conversarmos sobre sua ideia e prepararmos uma proposta para você!
