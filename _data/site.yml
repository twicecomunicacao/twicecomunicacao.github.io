sobre:
  rotulo: "01 — A Twice"
  titulo: "Comunicação em dobro."
  paragrafos:
    - texto: "A Twice trabalha com produção de vídeos, **de forma mobile**, para diferentes objetivos: desde a cobertura espontânea de um evento até conteúdos planejados, do roteiro à edição."
    - texto: "Cada projeto ganha uma linguagem própria, pensada para a marca, para o público e para sua finalidade, seja para comunicar, divulgar ou simplesmente guardar um momento."
  foto1: "assets/img/img_6819.webp"
  foto1_nome: "Luísa Clara"
  foto1_legenda: "Videomaker"
  foto2: "assets/img/img_9095.webp"
