      - name: linha1
        label: Linha 1
        widget: string
        required: false
      - name: linha2
        label: Linha 2
        widget: string
        required: false
      - name: link_condicoes
        label: Link de "Condições e suporte"
        widget: string
        hint: Deixe vazio para esconder.
        required: false
